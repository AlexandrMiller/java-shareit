name: API Tests

on:
  pull_request:
    branches: [ main, add-bookings ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 12345
          POSTGRES_DB: shareit
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Start application
        run: |
          java -jar target/*.jar &
          sleep 30

      - name: Install newman
        run: npm install -g newman

      - name: Run Postman tests
        run: |
          newman run ./tests/postman/sprint.json --delay-request 50